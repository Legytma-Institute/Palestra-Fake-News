<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Verifica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--papel); color:var(--tinta); font-family:var(--font-texto); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; overflow:hidden; }
  .tint { fill:var(--papel-2); }
  .fato { fill:var(--fato); }
  .fake { fill:var(--fake); }
  .mt   { fill:var(--marca-texto); }
  .blk  { rx:var(--raio-md); }
  .glyph { fill:var(--tinta); font-family:var(--font-display); font-weight:800; font-size:340px; }
  .words { position:absolute; left:var(--espaco-4); bottom:var(--espaco-3); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:88px; line-height:.92; font-weight:800; letter-spacing:-.02em; color:var(--tinta); }
  .tag { margin:var(--espaco-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--tinta-suave); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      marca-texto 160×272 bled off the top (the largest: the highlighter is the brand's gesture) · fake 160×224 bled off the right · fato 128×192 · papel-2 128×32 masthead tint — ≈37% of 960×288
  arrangement newspaper columns of unequal height, bottoms on one line espaco-3 above the edge, espaco-2 gutters
  pattern     one oversized "?" in the display face (Bricolage Grotesque 800), clipped by the marca-texto block — chosen because the talk is about doubting before sharing
  scales      sides in espaco-2 multiples; gutters espaco-2; bottom inset espaco-3; corners raio-md on every block
-->
<defs>
  <clipPath id="col"><rect x="160" y="-16" width="160" height="272" rx="8"/></clipPath>
</defs>
<rect class="tint blk" x="16" y="16" width="128" height="32" rx="8"/>
<rect class="fato blk" x="16" y="64" width="128" height="192" rx="8"/>
<rect class="mt blk" x="160" y="-16" width="160" height="272" rx="8"/>
<g clip-path="url(#col)"><text class="glyph" x="168" y="300">?</text></g>
<rect class="fake blk" x="336" y="32" width="160" height="224" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Verifica</h1>
<p class="tag">Antes de compartilhar, confira.</p>
</div>
</div>
</body>
</html>
